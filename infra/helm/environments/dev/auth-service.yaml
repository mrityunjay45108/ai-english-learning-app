replicaCount: 1
image:
  repository: english-learning/auth-service
  tag: dev
namespace: english-learning-dev
service:
  port: 3001
env:
  - name: NODE_ENV
    value: development
  - name: PORT
    value: "3001"
livenessProbe:
  httpGet:
    path: /api/v1/health
    port: 3001
readinessProbe:
  httpGet:
    path: /api/v1/health
    port: 3001

image:
  pullPolicy: Never
