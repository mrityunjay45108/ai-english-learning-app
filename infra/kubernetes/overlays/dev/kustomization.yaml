apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: english-learning-dev
resources:
  - ../../base/namespace.yaml
  - ../../base/configmap.yaml
  - ../../base/secrets.yaml
  - ../../base/ingress.yaml
  - ../../services/auth-service/
  - ../../services/api-gateway/
patches:
  - target:
      kind: Deployment
      name: auth-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: api-gateway
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
